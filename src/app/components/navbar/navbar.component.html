<!-- 🔴 Top Banner -->
<div class="bg-danger text-light text-center py-2" style="cursor: pointer;">
  Grab Bestselling Books up to 50% Off!
</div>

<!-- 🔴 Main Navbar -->
<div class="container-fluid px-3 px-lg-5 py-2 border-bottom border-danger">
  <div class="row align-items-center">

    <!-- 🔴 Logo -->
    <div class="col-4 col-lg-2">
      <img
        src="https://d2g9wbak88g7ch.cloudfront.net/staticimages/logo-new.png"
        class="img-fluid"
        routerLink="/home"
        style="cursor: pointer; max-height: 40px;">
    </div>

    <!-- 🔴 Search Bar -->
    <div class="col-8 col-lg-6">
      <div class="input-group">
        <input
          type="text"
          class="form-control"
          placeholder="Search By Title, Author, Publisher Or ISBN"
          aria-label="Search books"
          style="border: 1px solid #dc3545;">
        <button class="btn btn-danger" type="button">
          <i class="bi bi-search"></i>
        </button>
      </div>
    </div>

    <!-- 🔴 Account & Cart (Desktop Only) -->
    <div class="col-lg-4 d-none d-lg-flex justify-content-end align-items-center gap-4">
      <div class="d-flex align-items-center">
        <i class="bi bi-person-circle fs-5 text-danger me-2"></i>
        <span class="me-3">My Account</span>
        <i class="bi bi-cart3 fs-5 text-danger"></i>
      </div>
    </div>
  </div>
</div>

<!-- 🔴 Navigation Links & Wishlist -->
<div class="container-fluid px-3 px-lg-5 py-2 d-flex justify-content-between align-items-center flex-wrap">
  <div class="d-flex flex-wrap align-items-center gap-3">
    <ng-container *ngFor="let item of navArray; let idx = index">
      <span class="fw-medium">{{ item }}</span>
      <span class="text-danger" *ngIf="idx < navArray.length - 1">|</span>
    </ng-container>
  </div>
  <div class="d-flex align-items-center">
    <i class="bi bi-heart fs-4 text-danger"></i>
  </div>
</div>

<!-- 🔴 Divider -->
<hr class="m-0" style="border-top: 2px solid #dc3545;">
