<div class="p-2 bg-danger text-light nav1 text-center overflow-hidden">
    Grab Bestselling Books upto 50% Off!
</div>
<div class="row align-items-center p-2 px-lg-0 overflow-hidden">
    <div class="col-3 col-lg-2">
        <img src="https://d2g9wbak88g7ch.cloudfront.net/staticimages/logo-new.png" class="img-fluid"
            routerLink="/home" style="cursor: pointer;">
    </div>
    <div class="col-9 col-lg-5">
        <div class="input-group">
            <input style="border: 1px solid red;" type="text" class="form-control d-md-block d-none"
                placeholder="Search By Title, Author, Publisher Or ISBN" aria-label="Recipient's username"
                aria-describedby="button-addon2">
            <input style="border: 1px solid red;" type="text" class="form-control d-md-none d-block placehold1"
                placeholder="Search By Title, Author, Publisher Or ISBN" aria-label="Recipient's username"
                aria-describedby="button-addon2">
            <button class="btn btn-danger" type="button" id="button-addon2"><i class="bi bi-search"></i></button>
        </div>
    </div>
    <div class="col ms-5 d-md-block d-none">
        <div class="row">
            <div class="col text-end">
                <i style="color: rgb(224, 35, 35);" class="mx-1 bi bi-person-circle"></i>
                <div class="d-inline">My Account</div>
                <i class="mx-1 bi bi-chevron-right"
                    style="color: rgb(224, 35, 35); border-right: 1px solid rgb(224, 35, 35);"></i>
                <i class="bi bi-cart3 mx-4" style="color: rgb(224, 35, 35);"></i>
            </div>
        </div>
    </div>
</div>

<div class=" d-md-block d-none overflow-hidden">
    <div class="row m-1 align-items-center">
        <div class="col text-center" style="font-size: 0.8rem;" *ngFor="let i of navArray">
            {{i}}
        </div>
        <div class="col-3 text-end">
            <i style="color: rgb(224, 35, 35); font-size: 2rem;" class="bi bi-heart"></i>
        </div>
    </div>

    <hr style="color: rgb(224, 35, 35);">
</div>
