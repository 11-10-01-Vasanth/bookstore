<!-- Checkout Heading -->
<div class="text-center my-4">
  <h3 class="text-danger fw-bold" style="font-family: 'Poppins', sans-serif;">Checkout Your Order</h3>
</div>

<!-- Main Content -->
<div class="container">
  <div class="row row-cols-1 row-cols-md-2 g-4">

    <!-- Book Summary Card -->
    <div class="card shadow-sm p-3 mb-4">
      <div class="row g-0">
        <div class="col-md-4 d-flex align-items-center justify-content-center">
          <img [src]="bookData.imageUrl" class="img-fluid rounded-start" alt="Book Image" style="max-height: 200px;">
        </div>
        <div class="col-md-8">
          <div class="card-body">
            <h5 class="card-title text-danger fw-semibold">{{ bookData.title }}</h5>
            <p class="card-text mb-1"><strong>Author:</strong> {{ bookData.author }}</p>
            <p class="card-text mb-1"><strong>Publisher:</strong> {{ bookData.publisher }}</p>
            <p class="text-danger fs-4 mb-1"><i class="bi bi-currency-rupee"></i>{{ bookData.price }}</p>
            <p class="mb-1"><del>M.R.P. ₹300</del> | <span class="text-success fw-medium">Save ₹71 (22%)</span></p>
            <p class="text-success mb-1">Available</p>
            <p class="text-danger mb-0">Ships within 6–8 Business Days</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Shipping Details Form -->
    <div class="card shadow p-4">
      <h4 class="mb-4 text-danger">Shipping Details</h4>
      <form #userdetail="ngForm" (ngSubmit)="saveUser(userdetail.value)">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Email</label>
            <input type="email" name="customerEmail" [(ngModel)]="customerEmail" class="form-control" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Password</label>
            <input type="password" name="customerPassword" [(ngModel)]="customerPassword" class="form-control" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Name</label>
            <input type="text" name="customerName" [(ngModel)]="customerName" class="form-control" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Phone</label>
            <input type="tel" name="customerPhone" [(ngModel)]="customerPhone" class="form-control" required>
          </div>
          <div class="col-12">
            <label class="form-label">Address</label>
            <textarea name="customerAddress" [(ngModel)]="customerAddress" class="form-control" rows="2" required></textarea>
          </div>
        </div>
        <div class="text-end mt-4">
          <button type="submit" class="btn btn-danger">
            Save & Continue <i class="bi bi-arrow-right-short"></i>
          </button>
        </div>
      </form>
    </div>

  </div>
</div>
