<app-carousel></app-carousel>
<hr>
<div class="mx-5">
    <!-- Now Trending -->
    <div class="row">
        <div class="col">
            <h3 style="font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;">Now Trending</h3>
        </div>
        <div class="col text-end">
            <a style="text-decoration: underline; color: rgb(224, 35, 35);cursor: pointer;"
                (click)="seeall('Now Trending')">See All</a>
        </div>
    </div>
    <app-cardlayout [nowTrendingData]="nowTrending"></app-cardlayout>
    <div class="d-none d-md-block">
        <div class="row m-1">
            <div class="col img-fluid" *ngFor="let i of nowTrendingImages;"><img [src]="i" width="100%" height="100%"
                    alt="">
            </div>
        </div>
    </div>
    <div class="d-block d-md-none">
        <div class="row mt-1">
            <div class="col-md mb-2">
                <div id="carouselExampleControls1" class="carousel slide" data-bs-ride="carousel">
                    <div class="carousel-inner" style="border-radius: 15px;">
                        <div class="carousel-item active" *ngFor="let i of nowTrendingImages; let a=index"
                            [class.active]="a===0">
                            <img [src]="i" class="d-block w-100" style="height: 30vh;" alt="...">
                        </div>
                    </div>
                    <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleControls1"
                        data-bs-slide="prev">
                        <span class="carousel-control-prev-icon bg-danger" aria-hidden="true"></span>
                        <span class="visually-hidden">Previous</span>
                    </button>
                    <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleControls1"
                        data-bs-slide="next">
                        <span class="carousel-control-next-icon bg-danger" aria-hidden="true"></span>
                        <span class="visually-hidden">Next</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
    <!-- Best Sellers -->
    <div class="row mt-4">
        <div class="col">
            <h3 style="font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;">Best Sellers</h3>
        </div>
        <div class="col text-end">
            <a style="text-decoration: underline; color: rgb(224, 35, 35);cursor: pointer;"
                (click)="seeall('Best Sellers')">See All</a>
        </div>
    </div>
    <app-cardlayout [nowTrendingData]="nowTrending"></app-cardlayout>
    <div class="d-none d-md-block">
        <img class="img-fluid" src="https://www.bookswagon.com/images/promotionimages/web/mangamania.jpg?v=6.2" alt="">
    </div>
    <div class="d-block d-md-none">
        <img class="img-fluid mt-2 w-100" style="height: 30vh;"
            src="https://www.bookswagon.com/images/promotionimages/mobile/bwtop100.jpg?v=6.2" alt="">
    </div>
    <!-- New Arrivals -->
    <div class="row mt-4">
        <div class="col">
            <h3 style="font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;">New Arrivals</h3>
